[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signin-chatgpt-spike"
version = "0.1.0"
description = "A small reference implementation for Sign in with ChatGPT and Responses function tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27,<1",
    "keyring>=25,<27",
    "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "ruff>=0.5,<1",
]

[project.scripts]
signin-chatgpt-spike = "signin_chatgpt_spike.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
